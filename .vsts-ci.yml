jobs:
- job: VS_Latest
  variables:
    NUGET_PACKAGES: $(Agent.WorkFolder)\.nuget
    NUGET_HTTP_CACHE_PATH: $(Agent.WorkFolder)\.nuget-http-cache

  pool:
    vmImage: 'windows-2022'

  steps:
  # Restore nuget.org to the list of existing sources, .NET 6 Pre 2 may somehow remove it
  - powershell: |
      dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org | Out-Null
      $global:LASTEXITCODE = 0
    displayName: Adjust nuget.org source 

  - pwsh: |
      dotnet tool uninstall nbgv -g
      dotnet tool install nbgv -g --version 3.6.139
      nbgv cloud -a
    displayName: Version with NBGV
    name: NBGV
  
  - pwsh: |
      $InformationalVersion="$(NBGV_SemVer2)+$(NBGV_GitCommitId)-$(NBGV_BuildingRef)".Replace("refs/heads/","").Replace("/","-")
      echo "##vso[task.setvariable variable=NBGV_InformationalVersion;]$InformationalVersion"
      echo "##vso[task.setvariable variable=NBGV_InformationalVersion;isOutput=true;]$InformationalVersion"
      echo "Informational Version: $InformationalVersion"
  
    displayName: Generate Informational Version
    name: NBGV_InformationalVersion

  - template: scripts/ci/dotnet-install-windows.yml
  
  - pwsh: |
       cd src\BehaviorsSDKManaged\Microsoft.Xaml.Interactivity
       dotnet build Microsoft.Xaml.Interactivity.Uno.csproj -c Release "/p:PackageOutputPath=$(build.artifactstagingdirectory)\nuget" "/p:PackageVersion=$(NBGV_SemVer2)" "/p:InformationalVersion=$(NBGV_InformationalVersion)" /detailedsummary /bl:$(build.artifactstagingdirectory)\build-lib-winui.binlog
    displayName: Build WinUI package

  - pwsh: |
       cd samples\CS\XamlBehaviorsSample.Uno
       dotnet publish XamlBehaviorsSampleUno.csproj -f net10.0-browserwasm -c Release /bl:$(build.artifactstagingdirectory)\build-sample.binlog
    displayName: Build Sample App

  - template: scripts/ci/sign-packages.yml
  
  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: '$(build.artifactstagingdirectory)'
      ArtifactName: xamlbehavior-drop
      publishLocation: Container
  
  - task: PublishBuildArtifacts@1
    displayName: Publish Wasm site files
    inputs:
      pathToPublish: .\samples\CS\XamlBehaviorsSample.Uno\bin\Release\net10.0-browserwasm\publish
      artifactType: container
      artifactName: xamlbehavior-wasm

- job: RuntimeTests_Desktop
  displayName: Desktop Runtime Tests

  pool:
    vmImage: 'ubuntu-latest'

  variables:
    RuntimeTestsProject: src/BehaviorsSDKManaged/Microsoft.Xaml.Interactivity.RuntimeTests
    RuntimeTestsResults: $(Build.ArtifactStagingDirectory)/desktop-runtime-tests-results.xml

  steps:
  - task: UseDotNet@2
    displayName: 'Use .NET SDK 10.0.101'
    retryCountOnTaskFailure: 3
    inputs:
      packageType: sdk
      version: '10.0.101'

  # BehaviorsTargetFrameworksOverride keeps the referenced library on net10.0: the iOS/Android
  # workloads are not installed (and iOS cannot be) on this Linux agent.
  - bash: dotnet build $(RuntimeTestsProject)/Microsoft.Xaml.Interactivity.RuntimeTests.csproj -c Release -p:BehaviorsTargetFrameworksOverride=net10.0 -p:GeneratePackageOnBuild=false -bl:$(Build.ArtifactStagingDirectory)/build-runtime-tests.binlog
    displayName: Build runtime tests app

  # The engine runs every test on startup when UNO_RUNTIME_TESTS_RUN_TESTS is set, writes the
  # NUnit results to UNO_RUNTIME_TESTS_OUTPUT_PATH, then exits the app.
  - bash: |
      set -euo pipefail
      sudo apt-get update -qq
      sudo apt-get install -y -qq xvfb fluxbox
      cd $(RuntimeTestsProject)/bin/Release/net10.0-desktop
      xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' bash -c "{ fluxbox & } ; dotnet Microsoft.Xaml.Interactivity.RuntimeTests.dll" || true
      if [ ! -f "$UNO_RUNTIME_TESTS_OUTPUT_PATH" ]; then
        echo "Runtime tests did not produce results at $UNO_RUNTIME_TESTS_OUTPUT_PATH"
        exit 1
      fi
    displayName: Run runtime tests
    env:
      UNO_RUNTIME_TESTS_RUN_TESTS: '{}'
      UNO_RUNTIME_TESTS_OUTPUT_PATH: $(RuntimeTestsResults)

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testRunTitle: 'Desktop Runtime Tests'
      testResultsFormat: 'NUnit'
      testResultsFiles: $(RuntimeTestsResults)
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: runtime-tests
      publishLocation: Container
