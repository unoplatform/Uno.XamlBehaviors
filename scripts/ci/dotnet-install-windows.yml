parameters:
  # Same pin as Uno.Toolkit: uno.check ships its manifest as an embedded resource, and 1.34.1
  # provisions wasm-tools for 10.0.101 (mono.toolchain.current 10.0.101). On a newer SDK that
  # manifest sits below the SDK and net10.0-ios library builds fail with NETSDK1147.
  # Raise both versions together.
  DotNetVersion: '10.0.101'
  UnoCheck_Version: '1.34.1'

steps:

  # Required until .NET installs properly on Windows using UseDotnet
  # using preview builds
  # - powershell: |
  #     $ProgressPreference = 'SilentlyContinue'
  #     Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile dotnet-install.ps1
  #     & .\dotnet-install.ps1 -Version ${{ parameters.DotNetVersion }} -InstallDir "$env:ProgramFiles\dotnet\" -Verbose
  #     & dotnet --list-sdks
  #   displayName: Install .NET ${{ parameters.DotNetVersion }}
  #   errorActionPreference: stop
  #   retryCountOnTaskFailure: 3
  - task: UseDotNet@2
    displayName: 'Use .NET Core SDK ${{ parameters.DotNetVersion }}'
    retryCountOnTaskFailure: 3
    inputs:
      packageType: sdk
      version: ${{ parameters.DotNetVersion }}
      includePreviewVersions: true
    
  - powershell: |
      & dotnet tool update --global uno.check --version ${{ parameters.UnoCheck_Version }} --add-source https://api.nuget.org/v3/index.json
      & uno-check -v --ci --non-interactive --fix --skip androidsdk --skip xcode --skip gtk3 --skip vswin --skip vsmac
    displayName: Install .NET Workloads
    errorActionPreference: continue
    ignoreLASTEXITCODE: true
    retryCountOnTaskFailure: 3